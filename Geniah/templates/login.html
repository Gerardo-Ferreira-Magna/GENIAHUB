{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="{% static 'css/estilo_login.css' %}">
</head>
<body>
  <div class="container-grid">
    
    <!-- Lado izquierdo: formulario -->
    <div class="form-container">
      <h2 class="text-center mb-4">Iniciar Sesión</h2>
      
      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="********" required>
            <span class="input-group-text toggle-password">
              <i class="bi bi-eye" id="togglePassword"></i>
            </span>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Ingresar</button>
        </div>
      </form>

      <div class="social-login mt-4 text-center">
        <p>O ingresa con:</p>
        <button class="btn btn-outline-dark me-2"><i class="bi bi-google"></i> Google</button>
        <button class="btn btn-outline-dark"><i class="bi bi-github"></i> GitHub</button>
      </div>

      <p class="text-center mt-4">
        ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a>
      </p>
    </div>

    <!-- Lado derecho: imagen -->
    <div class="image-container">
      <img src="{% static 'img/img1.jpg' %}" alt="Imagen Registro">
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Mostrar/ocultar contraseña -->
  <script>
    const togglePassword = document.querySelector("#togglePassword");
    const password = document.querySelector("#password");

    togglePassword.addEventListener("click", function () {
      const type = password.getAttribute("type") === "password" ? "text" : "password";
      password.setAttribute("type", type);
      this.classList.toggle("bi-eye");
      this.classList.toggle("bi-eye-slash");
    });
  </script>
</body>
</html>
